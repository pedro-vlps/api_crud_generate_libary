[project]
name = "api-crud-generate-libary"
version = "1.2.0"
description = "Generate typed FastAPI CRUD routes for PostgreSQL and SQLAlchemy async models."
authors = [
    {name = "Pedro Vieira", email = "pedro515vieira@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    "fastapi>=0.135.3,<0.136.0",
    "sqlalchemy[asyncio]>=2.0.49,<3.0.0",
    "asyncpg>=0.31.0,<0.32.0"
]

keywords = ["fastapi", "crud", "postgresql", "sqlalchemy", "asyncpg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/pedro-vlps/api_crud_generate_libary"
Issues = "https://github.com/pedro-vlps/api_crud_generate_libary/issues"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
pytest-asyncio = ">=1.0,<2"
httpx = ">=0.28,<0.29"
pylint = ">=3.3,<5"
black = ">=25,<27"
build = ">=1.2,<2"
twine = ">=6,<8"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgresql: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]

[tool.black]
line-length = 80
target-version = ["py313"]

[tool.poetry]
packages = [{ include = "api_crud_generate_libary" }]
include = [
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "examples", format = "sdist" },
    { path = "tests", format = "sdist" },
]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
