name: Publish package

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package registry
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
      release_tag:
        description: Existing release tag, matching the package version
        type: string
        default: v1.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.target }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release tag and metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Release tag must use vMAJOR.MINOR.PATCH")
          sha = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"],
              text=True,
          ).strip()
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", sha, "origin/main"],
              check=True,
          )
          metadata = tomllib.loads(subprocess.check_output(
              ["git", "show", f"{sha}:pyproject.toml"], text=True,
          ))
          if tag != f"v{metadata['project']['version']}":
              raise SystemExit("Release tag does not match package version")
          if metadata["project"]["name"] != "api-crud-generate-libary":
              raise SystemExit("Unexpected distribution name")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source_sha={sha}\n")
          PY

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_sha }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/api-crud-generate-libary' || 'https://test.pypi.org/p/api-crud-generate-libary' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions-python-3.13
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
